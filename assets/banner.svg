<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Pattern for Grid Background -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.12); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes penDraw {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(15px, -8px) rotate(5deg); }
      }
      @keyframes shimmer {
        0% { stop-color: #60a5fa; }
        50% { stop-color: #f472b6; }
        100% { stop-color: #60a5fa; }
      }

      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 8s ease-in-out infinite; }
      .glow-orb-1 { animation: pulseGlow 6s ease-in-out infinite alternate; }
      .glow-orb-2 { animation: pulseGlow 8s ease-in-out infinite alternate-reverse; }
      .animated-dash { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
      .animated-pen { animation: penDraw 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="18" fill="url(#gridPattern)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Z-ORDER: BEHIND TEXT) -->
  <g id="dynamic-ambient-background">
    <!-- Glowing Orbs in Background -->
    <circle class="glow-orb-1" cx="220" cy="90" r="130" fill="url(#glowCyan)" filter="url(#blurGlow)" />
    <circle class="glow-orb-2" cx="980" cy="310" r="150" fill="url(#glowViolet)" filter="url(#blurGlow)" />
    <circle class="glow-orb-1" cx="620" cy="380" r="110" fill="#3b82f6" opacity="0.2" filter="url(#blurGlow)" />

    <!-- Animated Data Flow Curved Lines in Background -->
    <path class="animated-dash" d="M -50 320 C 300 280, 450 400, 750 330 C 950 280, 1100 350, 1250 310" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" />
    <path class="animated-dash" d="M -50 110 C 250 190, 500 50, 800 130 C 1000 190, 1150 100, 1250 150" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" style="animation-direction: reverse;" />

    <!-- Left Floating Decorative Element: Digital Contract Card -->
    <g class="floating-card-1" opacity="0.45">
      <rect x="50" y="70" width="150" height="190" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)" />
      <!-- Document Lines -->
      <line x1="70" y1="100" x2="130" y2="100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="70" y1="120" x2="170" y2="120" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="70" y1="135" x2="160" y2="135" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="70" y1="150" x2="175" y2="150" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Signature line & stamp badge -->
      <path d="M 70 195 Q 85 175, 100 195 T 120 185 T 140 195" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="165" cy="220" r="16" fill="#0ea5e9" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <path d="M 160 220 L 164 224 L 171 216" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right Floating Decorative Element: Cloud Vault & E-Sign Stamp -->
    <g class="floating-card-2" opacity="0.45">
      <rect x="990" y="70" width="160" height="200" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#dropShadow)" />
      <!-- Cloud Storage Node Graphic -->
      <circle cx="1070" cy="120" r="28" fill="#8b5cf6" opacity="0.25" stroke="#a855f7" stroke-width="1.5" />
      <path d="M 1060 120 L 1070 110 L 1080 120 M 1070 112 L 1070 132" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Check status pills -->
      <rect x="1015" y="165" width="110" height="18" rx="9" fill="#10b981" opacity="0.2" stroke="#34d399" stroke-width="1" />
      <text x="1070" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399" font-weight="600" text-anchor="middle">VERIFIED eIDAS</text>
      <!-- Lock Badge -->
      <rect x="1015" y="195" width="110" height="18" rx="9" fill="#6366f1" opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <text x="1070" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc" font-weight="600" text-anchor="middle">AES-256 ENCRYPTED</text>
    </g>
  </g>

  <!-- FOREGROUND: TITLE, SUBTITLE & METRICS (ALWAYS CRISP & IN FOREGROUND) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 68)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#dropShadow)" />
      <circle cx="-145" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#93c5fd" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME CURATED REGISTRY • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#dropShadow)">
      Awesome Document Management
    </text>
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="36" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5" filter="url(#dropShadow)">
      &amp; E-Signature Cloud
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" text-anchor="middle" font-weight="500">
      Enterprise SaaS Solutions • Self-Hosted Open-Source • Pricing, Limits &amp; Compliance Guide
    </text>

    <!-- Interactive / Status Pills in Center Foreground -->
    <g transform="translate(600, 290)">
      <!-- Pill 1: E-Sign Standards -->
      <g transform="translate(-270, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e1e38" stroke="#3b82f6" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" font-weight="600" text-anchor="middle">⚡ ESIGN / eIDAS</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-90, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e1e38" stroke="#10b981" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a7f3d0" font-weight="600" text-anchor="middle">🔓 Open-Source DMS</text>
      </g>
      <!-- Pill 3: SaaS & Cloud -->
      <g transform="translate(90, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ddd6fe" font-weight="600" text-anchor="middle">☁️ SaaS Benchmarks</text>
      </g>
      <!-- Pill 4: Pricing & Free Limits -->
      <g transform="translate(270, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e1e38" stroke="#f43f5e" stroke-width="1.2" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fecdd3" font-weight="600" text-anchor="middle">💰 Transparent Pricing</text>
      </g>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(600, 360)">
      <line x1="-350" y1="-15" x2="350" y2="-15" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="500">
        Curated with ❤️ for Developers, DevOps Engineers, Legal Ops &amp; Privacy Teams
      </text>
    </g>
  </g>
</svg>
